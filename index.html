<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Kasir Pro — POS</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/logo/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div><div id="loadingText">Memuat...</div></div>

  <section id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand-mark"><i class="fa-solid fa-cash-register"></i></div>
      <div><h1>Kasir Pro</h1><p class="muted">Point of Sale modern berbasis Firebase</p></div>
      <form id="loginForm" class="stack">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" required placeholder="admin@email.com"></label>
        <label>Password<div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"><button id="togglePassword" type="button" class="icon-btn" aria-label="Tampilkan password"><i class="fa-regular fa-eye"></i></button></div></label>
        <button id="loginBtn" class="btn btn-primary" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
        <button id="forgotPasswordBtn" class="btn btn-ghost" type="button">Lupa password?</button>
      </form>
      <p class="tiny muted">Akun dibuat melalui Firebase Authentication. Tidak ada pendaftaran admin publik.</p>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><div class="logo-mini"><i class="fa-solid fa-cash-register"></i></div><div><strong id="storeNameSide">Kasir Pro</strong><span>Point of Sale</span></div></div>
      <nav id="sideNav" class="nav-list"></nav>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button id="mobileMenuBtn" class="icon-btn mobile-only"><i class="fa-solid fa-bars"></i></button>
        <div><h2 id="pageTitle">Dashboard</h2><div class="status-line"><span id="networkStatus" class="network online"><i class="fa-solid fa-circle"></i> Online</span><span id="clockText"></span></div></div>
        <div class="topbar-actions">
          <button id="themeToggle" class="icon-btn" title="Mode gelap"><i class="fa-regular fa-moon"></i></button>
          <div class="user-chip"><div class="avatar" id="userAvatar">A</div><div><strong id="userName">Pengguna</strong><span id="userRole">-</span></div></div>
          <button id="logoutBtn" class="icon-btn danger" title="Keluar"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
      </header>

      <section id="pageContent" class="page-content"></section>
    </main>
    <nav id="bottomNav" class="bottom-nav"></nav>
  </div>

  <div id="modalRoot"></div>

  <template id="confirmTemplate">
    <div class="modal-backdrop">
      <div class="modal-card modal-sm">
        <button class="modal-x" data-close-modal><i class="fa-solid fa-xmark"></i></button>
        <h3 data-confirm-title>Konfirmasi</h3>
        <p class="muted" data-confirm-message></p>
        <div class="modal-actions"><button class="btn btn-ghost" data-close-modal>Batal</button><button class="btn btn-danger" data-confirm-ok>Ya, lanjutkan</button></div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
